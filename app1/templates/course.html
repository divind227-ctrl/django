<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            transform: perspective(1000px) rotateX(2deg);
            transition: transform 0.3s ease;
        }
        
        .container:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-5px);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .nav-button {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
            transform: translateZ(20px);
        }
        
        .nav-button:hover {
            transform: translateZ(20px) translateY(-3px);
            box-shadow: 0 12px 30px rgba(245, 87, 108, 0.6);
        }
        
        .nav-button:active {
            transform: translateZ(20px) translateY(-1px);
        }
        
        ul {
            list-style: none;
            padding: 0;
        }
        
        li {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            margin: 15px 0;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
            transform: translateX(0);
            position: relative;
            overflow: hidden;
        }
        
        li::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.5s ease;
        }
        
        li:hover::before {
            left: 100%;
        }
        
        li:hover {
            transform: translateX(10px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            border-left-width: 8px;
        }
        
        li::after {
            content: '→';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            color: #667eea;
            font-size: 1.5em;
        }
        
        li:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="/mark/course/dep/">
            <button type="submit" class="nav-button">📚 Go to Department</button>
        </form>
        
        <h1>Available Courses</h1>
        
        <ul>
            {% for course in courses %}
            <li>{{ course }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
