<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal</title>
    <style>
        /* ---------- Base Styles ---------- */
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", Arial, sans-serif;
            text-align: center;
            background: radial-gradient(circle at top left, #4facfe, #00f2fe);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden;
        }

        /* ---------- Animated Gradient Glow ---------- */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 90deg, #00f2fe, #4facfe, #007bff, #00f2fe);
            filter: blur(150px);
            opacity: 0.5;
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------- 3D Heading ---------- */
        h1 {
            font-size: 3.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,0.1),
                0 0 5px rgba(0,0,0,0.1),
                0 1px 3px rgba(0,0,0,0.3),
                0 3px 5px rgba(0,0,0,0.2),
                0 5px 10px rgba(0,0,0,0.25);
            transform: rotateX(10deg);
            transition: transform 0.3s ease;
        }

        h1:hover {
            transform: rotateX(0deg) scale(1.05);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        /* ---------- 3D Button ---------- */
        button {
            padding: 14px 40px;
            background: linear-gradient(145deg, #ffffff, #d9eaff);
            color: #007bff;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px #007bff, 0 6px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
            transform: translateY(0);
        }

        button:hover {
            background: #007bff;
            color: #fff;
            box-shadow: 0 4px #0056b3, 0 8px 25px rgba(0, 0, 0, 0.4);
            transform: translateY(-4px);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px #004aad;
        }

        /* ---------- Floating Card Shadow ---------- */
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transform: rotateY(5deg) rotateX(5deg);
            transition: transform 0.5s ease;
        }

        .card:hover {
            transform: rotateY(0deg) rotateX(0deg) scale(1.02);
        }

        /* ---------- Footer ---------- */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .card { padding: 30px; width: 85%; }
            button { padding: 12px 28px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to the Student Portal</h1>
        <p>Click below to view your marks</p>
        <form action="/mark/">
            <button type="submit">View Marks</button>
        </form>
    </div>

    <footer>© 2025 Student Portal | Designed with ❤️</footer>
</body>
</html>
