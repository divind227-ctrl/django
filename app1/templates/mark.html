<!DOCTYPE html>
<html>
<head>
    <title>Marks Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            transform: perspective(1500px) rotateY(-2deg);
            transition: transform 0.4s ease;
        }
        
        .container:hover {
            transform: perspective(1500px) rotateY(0deg) scale(1.02);
        }
        
        h1 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
            font-size: 3em;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            overflow: hidden;
        }
        
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        td {
            padding: 18px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
            transition: all 0.3s ease;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tr:hover td {
            background: linear-gradient(90deg, #f8f9ff 0%, #fff 100%);
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        td:first-child {
            font-weight: 600;
            color: #667eea;
        }
        
        td:last-child {
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            color: #f5576c;
        }
        
        .nav-button {
            width: 100%;
            padding: 18px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            transform: translateZ(30px);
        }
        
        .nav-button:hover {
            transform: translateZ(30px) translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        
        .nav-button:active {
            transform: translateZ(30px) translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Your Marks</h1>
        
        <table>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
            {% for subject, mark in marks.items %}
            <tr>
                <td>{{ subject }}</td>
                <td>{{ mark }}</td>
            </tr>
            {% endfor %}
        </table>

        <form action="/mark/course/">
            <button type="submit" class="nav-button">📚 Go to Courses</button>
        </form>
    </div>
</body>
</html>
